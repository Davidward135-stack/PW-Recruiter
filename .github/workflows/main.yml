name: NOVA Recruiter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recruit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare recruiter database
        run: |
          if [ ! -f logs.db ]; then
            cp sqlite/logs.db logs.db
          fi

      - name: Run NOVA recruiter
        env:
          PNW_API_KEY: ${{ secrets.PNW_API_KEY }}
          PNW_EMAIL: ${{ secrets.PNW_EMAIL }}
          PNW_PASSWORD: ${{ secrets.PNW_PASSWORD }}
        run: python recruiter.py

      - name: Save contacted nations
        run: |
          git config user.name "NOVA Recruiter"
          git config user.email "actions@github.com"
          git add logs.db
          git diff --cached --quiet || git commit -m "Update recruitment log"
          git push
