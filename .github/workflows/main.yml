name: NOVA Recruiter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recruit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Create contact log
        run: |
          if [ ! -f contacted.json ]; then
            echo "[]" > contacted.json
          fi

      - name: Run NOVA recruiter
        env:
          PNW_API_KEY: ${{ secrets.PNW_API_KEY }}
        run: python recruiter.py

      - name: Save contacted nations
        if: always()
        run: |
          git config user.name "NOVA Recruiter"
          git config user.email "actions@github.com"
          git add contacted.json
          git diff --cached --quiet || git commit -m "Update recruitment log"
          git push
