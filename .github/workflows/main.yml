name: Run NOVA recruiter

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-recruiter-single-run
  cancel-in-progress: true

jobs:
  recruit:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Check recruiter syntax
        run: python -m py_compile recruiter.py

      - name: Send recruitment messages
        env:
          PNW_API_KEY: ${{ secrets.PNW_API_KEY }}
          PNW_LEGACY_KEY: ${{ secrets.PNW_LEGACY_KEY }}
        run: python recruiter.py

      - name: Save blocked nation IDs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contacted.json
          if git diff --cached --quiet; then
            echo "No contacted.json changes to save."
          else
            git commit -m "Update contacted nations"
            git pull --rebase
            git push
          fi
